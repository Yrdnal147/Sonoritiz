name: sonoritiz
description: "Sonoritiz - Application mobile de streaming musical grand public."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Router
  go_router: ^13.0.0

  # Network
  dio: ^5.4.0
  web_socket_channel: ^2.4.1

  # Audio Streaming & Background Service
  just_audio: ^0.9.36
  audio_service: ^0.18.12

  # Local Storage & Preferences
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # UI Helper Packages
  flutter_spinkit: ^5.2.0
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.6
  url_launcher: ^6.2.2
  shimmer: ^3.0.0
  youtube_explode_dart: ^3.1.0
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  palette_generator: ^0.3.3+7
  video_player: ^2.11.1
  path_provider: ^2.1.6
  share_plus: ^10.0.0
  file_picker: ^8.0.7
  on_audio_query: ^2.9.0
  flutter_media_metadata: ^1.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
