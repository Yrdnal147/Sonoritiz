name: sonoritiz
description: "Sonoritiz - Application mobile de streaming musical grand public."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Router
  go_router: ^13.0.0

  # Network
  dio: ^5.4.0
  web_socket_channel: ^3.0.1
  google_sign_in: ^6.2.1
  google_mobile_ads: ^9.2.0

  # Audio Streaming & Background Service
  just_audio: ^0.9.36
  audio_service: ^0.18.12

  # Local Storage & Preferences
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI Helper Packages
  flutter_spinkit: ^5.2.0
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.6
  url_launcher: ^6.2.2
  shimmer: ^3.0.0
  youtube_explode_dart: ^3.1.0
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  palette_generator: ^0.3.3+7
  video_player: ^2.11.1
  path_provider: ^2.1.6
  share_plus: ^10.0.0
  file_picker: ^8.0.7
  on_audio_query: ^2.9.0
  image_picker: ^1.2.3
  audiotags: ^1.4.5
  home_widget: ^0.9.3
  speech_to_text: 7.0.0
  string_similarity: ^2.2.0
  intl: ^0.19.0
  flutter_local_notifications: ^17.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/app_logo_foreground.png"
  min_sdk_android: 21
